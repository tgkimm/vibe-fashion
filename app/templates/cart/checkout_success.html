{% extends "base.html" %}

{% block title %}주문 완료 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5 text-center my-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center p-4 mb-4 text-success mx-auto" style="width: 90px; height: 90px;">
                    <i class="bi bi-check-lg fs-1"></i>
                </div>
                <h3 class="fw-bold mb-2">주문 및 결제가 완료되었습니다!</h3>
                <p class="text-muted small mb-4">고객님의 주문이 정상적으로 접수되었습니다. 정성을 다해 준비하여 빠르게 배송해 드리겠습니다.</p>

                <div class="bg-light p-3 rounded-3 mb-4 text-start">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted small">주문 품목</span>
                        <span class="fw-semibold small">{{ total_count }}개</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted small">총 결제 금액</span>
                        <span class="fw-bold text-primary">{{ "{:,}".format(final_total) }}원</span>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2 fw-semibold rounded-pill">
                        쇼핑 계속하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
