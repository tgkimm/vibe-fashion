{% extends "base.html" %}

{% block title %}새 비밀번호 설정 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-3 text-primary">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">새 비밀번호 설정</h3>
                    <p class="text-muted small">새로운 비밀번호를 입력해 주세요.</p>
                </div>

                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i>{{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                {% if success_msg %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-1"></i>{{ success_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <!-- URL 파라미터로 넘어온 토큰 및 코드 보존 -->
                    <input type="hidden" name="token" value="{{ token or '' }}">
                    <input type="hidden" name="code" value="{{ code or '' }}">
                    <input type="hidden" name="access_token" value="{{ access_token or '' }}">
                    <input type="hidden" name="type" value="{{ type or '' }}">

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">새 비밀번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="6자 이상 입력" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label fw-semibold">새 비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password_confirm" name="password_confirm" placeholder="새 비밀번호 다시 입력" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                        비밀번호 변경 완료
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>로그인 페이지로 가기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
