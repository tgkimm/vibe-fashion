{% extends "base.html" %}

{% block title %}로그인 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-3 text-primary">
                        <i class="bi bi-person-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">로그인</h3>
                    <p class="text-muted small">VIBE-FASHION 회원으로 로그인하여 쇼핑을 즐겨보세요</p>
                </div>

                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i>{{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                {% if success_msg %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-1"></i>{{ success_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="next" value="{{ next or '' }}">

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">이메일 주소</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ request.args.get('email', '') or email or '' }}" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-semibold mb-0">비밀번호</label>
                            <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted text-decoration-none">비밀번호 찾기</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="비밀번호 입력" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                        로그인
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <span class="text-muted small">아직 계정이 없으신가요?</span>
                    <a href="{{ url_for('auth.signup') }}" class="small fw-semibold text-primary ms-1 text-decoration-none">
                        회원가입 하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
