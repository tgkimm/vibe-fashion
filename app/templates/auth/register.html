{% extends "base.html" %}

{% block title %}회원가입 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-3 text-success">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">회원가입</h3>
                    <p class="text-muted small">간편 가입으로 VIBE-FASHION의 특별한 혜택을 누리세요</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
                    <!-- 1. 아이디 입력 및 실시간 중복 체크 -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">아이디</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="영문/숫자 3~20자" minlength="3" maxlength="20" required autofocus>
                            <button class="btn btn-outline-secondary btn-sm px-3" type="button" id="btnCheckId">중복 확인</button>
                        </div>
                        <div id="idCheckFeedback" class="form-text mt-1 small"></div>
                    </div>

                    <!-- 2. 이름 입력 -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">이름</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-heading text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="name" name="name" value="{{ name or '' }}" placeholder="홍길동" required>
                        </div>
                    </div>

                    <!-- 3. 비밀번호 입력 (보안 조건 실시간 표시) -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">비밀번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="6자 이상, 대문자 및 특수기호 포함" required>
                        </div>
                        <div class="mt-2 p-2 bg-light rounded-2 border">
                            <div class="small fw-semibold text-muted mb-1">비밀번호 안전 규칙:</div>
                            <ul class="list-unstyled mb-0 small">
                                <li id="rule-len" class="text-danger"><i class="bi bi-x-circle me-1"></i>최소 6자 이상</li>
                                <li id="rule-upper" class="text-danger"><i class="bi bi-x-circle me-1"></i>영문 대문자(A-Z) 1개 이상 포함</li>
                                <li id="rule-special" class="text-danger"><i class="bi bi-x-circle me-1"></i>특수문자(!@#$%^&* 등) 1개 이상 포함</li>
                            </ul>
                        </div>
                    </div>

                    <!-- 4. 비밀번호 확인 -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label fw-semibold">비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password_confirm" name="password_confirm" placeholder="비밀번호 재입력" required>
                        </div>
                        <div id="pwMatchFeedback" class="form-text mt-1 small"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3" id="btnSubmit">
                        회원가입 완료
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <span class="text-muted small">이미 계정이 있으신가요?</span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary ms-1 text-decoration-none">
                        로그인 하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const usernameInput = document.getElementById("username");
    const btnCheckId = document.getElementById("btnCheckId");
    const idFeedback = document.getElementById("idCheckFeedback");

    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("password_confirm");
    const pwMatchFeedback = document.getElementById("pwMatchFeedback");

    const ruleLen = document.getElementById("rule-len");
    const ruleUpper = document.getElementById("rule-upper");
    const ruleSpecial = document.getElementById("rule-special");

    // 1. 아이디 중복 체크 함수
    function checkIdAvailability() {
        const val = usernameInput.value.trim();
        if (!val) {
            idFeedback.textContent = "아이디를 입력해 주세요.";
            idFeedback.className = "form-text mt-1 small text-danger";
            return;
        }

        idFeedback.textContent = "확인 중...";
        idFeedback.className = "form-text mt-1 small text-muted";

        fetch("{{ url_for('auth.check_id') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: val })
        })
        .then(res => res.json())
        .then(data => {
            if (data.available) {
                idFeedback.textContent = "✓ " + data.message;
                idFeedback.className = "form-text mt-1 small text-success fw-semibold";
            } else {
                idFeedback.textContent = "✗ " + data.message;
                idFeedback.className = "form-text mt-1 small text-danger fw-semibold";
            }
        })
        .catch(() => {
            idFeedback.textContent = "중복 확인 중 오류가 발생했습니다.";
            idFeedback.className = "form-text mt-1 small text-danger";
        });
    }

    btnCheckId.addEventListener("click", checkIdAvailability);
    usernameInput.addEventListener("blur", () => {
        if (usernameInput.value.trim().length >= 3) {
            checkIdAvailability();
        }
    });

    // 2. 비밀번호 강도 실시간 검증
    function updatePasswordRules() {
        const pw = passwordInput.value;
        
        // 최소 6자
        if (pw.length >= 6) {
            ruleLen.className = "text-success";
            ruleLen.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>최소 6자 이상';
        } else {
            ruleLen.className = "text-danger";
            ruleLen.innerHTML = '<i class="bi bi-x-circle me-1"></i>최소 6자 이상';
        }

        // 대문자 포함
        if (/[A-Z]/.test(pw)) {
            ruleUpper.className = "text-success";
            ruleUpper.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>영문 대문자(A-Z) 1개 이상 포함';
        } else {
            ruleUpper.className = "text-danger";
            ruleUpper.innerHTML = '<i class="bi bi-x-circle me-1"></i>영문 대문자(A-Z) 1개 이상 포함';
        }

        // 특수기호 포함
        if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?/~`]/.test(pw)) {
            ruleSpecial.className = "text-success";
            ruleSpecial.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>특수문자(!@#$%^&* 등) 1개 이상 포함';
        } else {
            ruleSpecial.className = "text-danger";
            ruleSpecial.innerHTML = '<i class="bi bi-x-circle me-1"></i>특수문자(!@#$%^&* 등) 1개 이상 포함';
        }

        checkMatch();
    }

    function checkMatch() {
        const pw = passwordInput.value;
        const confirm = confirmInput.value;
        if (!confirm) {
            pwMatchFeedback.textContent = "";
            return;
        }
        if (pw === confirm) {
            pwMatchFeedback.textContent = "✓ 비밀번호가 일치합니다.";
            pwMatchFeedback.className = "form-text mt-1 small text-success fw-semibold";
        } else {
            pwMatchFeedback.textContent = "✗ 비밀번호가 일치하지 않습니다.";
            pwMatchFeedback.className = "form-text mt-1 small text-danger fw-semibold";
        }
    }

    passwordInput.addEventListener("input", updatePasswordRules);
    confirmInput.addEventListener("input", checkMatch);
});
</script>
{% endblock %}
