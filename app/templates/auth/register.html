{% extends "base.html" %}

{% block title %}회원가입 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-3 text-success">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">회원가입</h3>
                    <p class="text-muted small">이메일 회원가입으로 VIBE-FASHION의 특별한 혜택을 누리세요</p>
                </div>

                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i>{{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.signup') }}" id="registerForm">
                    <!-- 1. 이메일 입력 -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">이메일 주소 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ request.args.get('email', '') or email or '' }}" placeholder="name@example.com" required autofocus>
                        </div>
                        <div class="form-text small text-muted">인증 링크가 발송될 유효한 이메일을 입력해 주세요.</div>
                    </div>

                    <!-- 2. 닉네임 입력 -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">닉네임 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="name" name="name" value="{{ request.args.get('name', '') or name or '' }}" placeholder="닉네임 입력 (다른 회원과 중복 불가)" required>
                            <button class="btn btn-outline-secondary" type="button" id="btnCheckNickname">중복 확인</button>
                        </div>
                        <div id="nicknameFeedback" class="form-text small"></div>
                    </div>

                    <!-- 3. 비밀번호 입력 (보안 조건 실시간 표시) -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">비밀번호 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="최소 6자 이상" minlength="6" required>
                        </div>
                        <div class="mt-2 p-2 bg-light rounded-2 border">
                            <div class="small fw-semibold text-muted mb-1">비밀번호 규칙:</div>
                            <ul class="list-unstyled mb-0 small">
                                <li id="rule-len" class="text-danger"><i class="bi bi-x-circle me-1"></i>최소 6자 이상</li>
                            </ul>
                        </div>
                    </div>

                    <!-- 4. 비밀번호 확인 -->
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label fw-semibold">비밀번호 확인 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password_confirm" name="password_confirm" placeholder="비밀번호 재입력" minlength="6" required>
                        </div>
                        <div id="pwMatchFeedback" class="form-text mt-1 small"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3" id="btnSubmit">
                        인증 메일 받고 회원가입
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <span class="text-muted small">이미 계정이 있으신가요?</span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary ms-1 text-decoration-none">
                        로그인 하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("password_confirm");
    const pwMatchFeedback = document.getElementById("pwMatchFeedback");
    const ruleLen = document.getElementById("rule-len");

    function updatePasswordRules() {
        const pw = passwordInput.value;
        if (pw.length >= 6) {
            ruleLen.className = "text-success";
            ruleLen.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>최소 6자 이상';
        } else {
            ruleLen.className = "text-danger";
            ruleLen.innerHTML = '<i class="bi bi-x-circle me-1"></i>최소 6자 이상';
        }
        checkMatch();
    }

    function checkMatch() {
        const pw = passwordInput.value;
        const confirm = confirmInput.value;
        if (!confirm) {
            pwMatchFeedback.textContent = "";
            return;
        }
        if (pw === confirm) {
            pwMatchFeedback.textContent = "✓ 비밀번호가 일치합니다.";
            pwMatchFeedback.className = "form-text mt-1 small text-success fw-semibold";
        } else {
            pwMatchFeedback.textContent = "✗ 비밀번호가 일치하지 않습니다.";
            pwMatchFeedback.className = "form-text mt-1 small text-danger fw-semibold";
        }
    }

    passwordInput.addEventListener("input", updatePasswordRules);
    confirmInput.addEventListener("input", checkMatch);

    // 닉네임 중복 확인
    const nameInput = document.getElementById("name");
    const btnCheckNickname = document.getElementById("btnCheckNickname");
    const nicknameFeedback = document.getElementById("nicknameFeedback");

    btnCheckNickname.addEventListener("click", () => {
        const nickname = nameInput.value.trim();
        if (!nickname) {
            nicknameFeedback.textContent = "닉네임을 입력해 주세요.";
            nicknameFeedback.className = "form-text small text-danger";
            return;
        }

        fetch(`{{ url_for('auth.check_nickname') }}?nickname=${encodeURIComponent(nickname)}`)
            .then(res => res.json())
            .then(data => {
                if (data.available) {
                    nicknameFeedback.textContent = "✓ 사용 가능한 닉네임입니다.";
                    nicknameFeedback.className = "form-text small text-success fw-semibold";
                } else {
                    nicknameFeedback.textContent = "✗ 이미 사용 중인 닉네임입니다.";
                    nicknameFeedback.className = "form-text small text-danger fw-semibold";
                }
            })
            .catch(() => {
                nicknameFeedback.textContent = "닉네임 확인 중 오류가 발생했습니다.";
                nicknameFeedback.className = "form-text small text-danger";
            });
    });
});
</script>
{% endblock %}
