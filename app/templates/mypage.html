{% extends "base.html" %}

{% block title %}마이페이지 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 me-3 text-primary" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-circle fs-2"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-1">{{ user.name or '회원' }}님 마이페이지</h4>
                        <p class="text-muted small mb-0">{{ user.email }}</p>
                    </div>
                </div>

                <div class="list-group list-group-flush border-top border-bottom mb-4">
                    <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-muted">이메일</span>
                        <span class="fw-semibold">{{ user.email }}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-muted">이름</span>
                        <span class="fw-semibold">{{ user.name or '-' }}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-muted">계정 상태</span>
                        <span class="badge bg-success-subtle text-success px-2 py-1">인증 완료</span>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('cart.view_cart') }}" class="btn btn-outline-primary flex-grow-1 py-2 rounded-3">
                        <i class="bi bi-cart3 me-1"></i>장바구니 보기
                    </a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger flex-grow-1 py-2 rounded-3">
                        <i class="bi bi-box-arrow-right me-1"></i>로그아웃
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
